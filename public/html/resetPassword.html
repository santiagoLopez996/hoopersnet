<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/style-index.css" />
  <link rel="stylesheet" href="/css/login.css" />

  <link rel="icon" href="fotos/BocetoLogoTransparente.png">
  <title>HoopersNet – Restablecer contraseña</title>
</head>

<body>
  <header class="hero auth-hero">
    <div class="hero-inner auth-inner">

      <div class="hero-text">
        <p class="hero-kicker">PLATAFORMA DE RECLUTAMIENTO DE BALONCESTO EN COLOMBIA</p>
        <h1>Restablecer contraseña</h1>
        <p class="hero-lead">
          Crea una nueva contraseña para tu cuenta.
        </p>

        <a class="auth-back" href="login.html">← Volver al login</a>
      </div>

      <div class="auth-side">
        <div class="auth-card">
          <img src="/fotos/BocetoLogoTransparente.png" class="auth-logo" alt="HoopersNet" />
          <h2 class="auth-title">Nueva contraseña</h2>
          <p class="auth-subtitle" id="reset-subtitle">Validando enlace…</p>

          <form id="form-reset" class="auth-form" style="display:none;">
            <label class="auth-label" for="newPassword">Nueva contraseña</label>
            <input class="auth-input" id="newPassword" type="password" placeholder="••••••••" required />

            <label class="auth-label" for="confirmPassword">Confirmar contraseña</label>
            <input class="auth-input" id="confirmPassword" type="password" placeholder="••••••••" required />

            <p id="reset-msg" class="auth-message"></p>

            <button type="submit" class="btn btn-jugador auth-submit" id="btn-confirm-reset">
              Cambiar contraseña
              <span class="btn-caption">Guardar nueva contraseña</span>
            </button>
          </form>

          <div id="reset-actions" style="margin-top:12px;"></div>
        </div>
      </div>

    </div>
  </header>

  <script type="module" src="/js/resetPassword.js"></script>
</body>
</html>
